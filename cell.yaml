# Liabilities cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Loans, credit, payables and other money owed (account_id from finance-accounts).
# Amounts are exact (money = numeric(19,4), decimal = numeric(30,10); SPEC-003); cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: liabilities
title: Liabilities
resources:
  liability:
    # SPEC-005: reference data only in events (no amounts, names or notes).
    graph: [liability_type, scope, account_id, currency, due_date, status]
    legacy_columns:
      scope: owner_scope
    table: liabilities
    plural: liabilities
    filters:
    - liability_type
    - scope
    - status
    fields:
      name:
        type: text
        required: true
        max_length: 200
      liability_type:
        type: enum
        values:
        - loan
        - credit
        - tax
        - payable
        - subscription
        - other
        required: true
      scope:
        type: text
        max_length: 64
        default: ''
      account_id:
        type: bigint
      principal_amount:
        type: money
        min: 0
      outstanding_amount:
        type: money
        min: 0
      minimum_payment:
        type: money
        min: 0
      interest_rate_percent:
        type: decimal
        min: 0
      currency:
        type: currency
        default: THB
      due_date:
        type: date
      status:
        type: enum
        values:
        - planned
        - active
        - overdue
        - settled
        - cancelled
        default: active
      metadata:
        type: json
        json: object
      notes:
        type: text
